name: License Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  license-check:
    name: License Check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install license tooling
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip "setuptools<82" wheel
          .venv/bin/python -m pip install uv "licensecheck>=2025.1.0,<2026.0.0"

      - name: Run license check
        run: make license-check
