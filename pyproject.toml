[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "wild-catalog"
version = "0.1.0"
description = "Wildlife image identification API for cataloging nature photos."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE.txt","NOTICE.txt"]
authors = [
    { name = "Jason Dentler" },
]
dependencies = [
    "birder>=0.5.2",
    "exifread @ git+https://github.com/jasondentler/exif-py.git@fix-license-detection",
    "fastapi>=0.115,<1.0",
    "h3>=4.1,<5.0",
    "numpy>=1.26,<3.0",
    "pillow>=12.0,<13.0",
    "pyarrow>=16.0,<21.0",
    "pydantic>=2.8,<2.13",
    "python-multipart>=0.0.9,<1.0",
    "rawpy>=0.21,<1.0",
    "torch>=2.10",
    "transformers>=4.45,<5.0",
    "accelerate>=1.0,<2.0",
    "typing-extensions>=4.12,<5.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.2,<9.0",
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.6,<1.0",
    "licensecheck>=2025.1.0,<2026.0.0",
    "pre-commit",
    "conventional-pre-commit",
    "commitizen",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/wild_catalog"]

[tool.ruff]
line-length = 100
target-version = "py313"  # Aligned with your project's pinned Python 3.13 development runtime

[tool.ruff.lint]
select = [
    "B",   # flake8-bugbear
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (auto-sorts and groups imports on save)
    "N",   # pep8-naming
    "UP",  # pyupgrade (enforces modern Python 3.13 native type hinting and syntax)
    "W",   # pycodestyle warnings
]

[tool.pytest.ini_options]
addopts = [
    "-ra",
    "--import-mode=importlib",
    "--cov=src/wild_catalog",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]
markers = [
    "integration: Suite for heavyweight integration tests that download and evaluate real models or large datasets",
]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
pythonpath = [".", "src"]
testpaths = ["tests/unit", "tests/integration"]

[tool.coverage.run]
branch = true
source = ["src/wild_catalog"]  # Ensures pytest-cov reads inside the src directory layout properly

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.licensecheck]
license = "Apache-2.0"
format = "ansi"
zero = true
